<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGACYWORLD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0a101c 0%, #040812 40%, #010306 70%, #000000 100%);
            color: #ffffff; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        :root {
            --blue-main: #3b82f6; --blue-light: #60a5fa; --blue-dark: #1e3a8a;
            --blue-soft: rgba(59, 130, 246, 0.3); --blue-glow: rgba(59, 130, 246, 0.6);
            --btn-blue: #2563eb; --btn-light: #60a5fa; --btn-dark: #1e40af;
            --card-bg: rgba(255, 255, 255, 0.04);
        }

        header { max-width: 1300px; margin: 0 auto; padding: 25px 40px; position: sticky; top: 15px; z-index: 100; }
        .nav-wrapper {
            background: rgba(6, 10, 20, 0.85); backdrop-filter: blur(15px); padding: 12px 25px;
            border-radius: 50px; display: flex; align-items: center; justify-content: space-between;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
            height: 100%;
        }

        .logo-line {
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 24px;
            line-height: 1;
        }
        .logo-line .blue-text { color: var(--blue-light); text-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .logo-line .white-text { color: #ffffff; text-shadow: 0 0 8px rgba(255,255,255,0.15); }

        nav ul { display: flex; gap: 25px; }
        nav ul li a {
            font-size: 15px; font-weight: 700; transition: all 0.3s ease; color: #bbbbbb;
            position: relative; cursor: pointer;
        }
        nav ul li a:hover, nav ul li a.active { color: var(--blue-light); text-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        nav ul li a.active::after {
            content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px;
            background: var(--blue-light); box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        .socials { display: flex; gap: 12px; }
        .social-btn {
            width: 36px; height: 36px; background: rgba(255, 255, 255, 0.05); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .social-btn:hover { background: var(--blue-light); border-color: var(--blue-light); box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); transform: scale(1.1) translateY(-2px); }
        .social-btn svg { width: 18px; height: 18px; fill: #ccc; transition: 0.3s; }
        .social-btn:hover svg { fill: #000; }

        .hero { max-width: 1300px; margin: 20px auto 0; padding: 0 40px; }
        .hero-card {
            position: relative; border-radius: 24px; min-height: 450px; padding: 70px 60px;
            display: flex; flex-direction: column; justify-content: center; 
            border: 1px solid rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.05), inset 0 0 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .hero-card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .hero-card .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, #0a101c 20%, rgba(10, 16, 28, 0.3) 60%, rgba(10, 16, 28, 0.8) 100%); z-index: 1;
        }

        .hero-title { font-size: 64px; font-weight: 900; line-height: 1.1; margin-bottom: 25px; max-width: 700px; text-shadow: 0 4px 30px rgba(0,0,0,0.8); position: relative; z-index: 2; }
        .hero-title .light-text { color: var(--blue-light); text-shadow: 0 0 30px rgba(59, 130, 246, 0.3), 0 0 60px rgba(59, 130, 246, 0.1); }
        .hero-title .white-text { color: #ffffff; }
        .hero-desc { color: #d0d0d0; font-size: 18px; margin-bottom: 40px; max-width: 500px; font-weight: 500; line-height: 1.6; text-shadow: 0 2px 10px rgba(0,0,0,0.7); position: relative; z-index: 2; }
        .hero-actions { display: flex; align-items: center; gap: 25px; position: relative; z-index: 2; }

        .btn-primary {
            background: var(--btn-blue); color: #ffffff; padding: 14px 32px;
            font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px;
            border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            border-radius: 4px;
            border-top: 2px solid var(--btn-light); border-left: 2px solid var(--btn-light);
            border-bottom: 2px solid var(--btn-dark); border-right: 2px solid var(--btn-dark);
            transition: all 0.1s ease; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); text-decoration: none;
        }
        .btn-primary:active {
            transform: translateY(2px); border-top: 2px solid var(--btn-dark); border-left: 2px solid var(--btn-dark);
            border-bottom: 2px solid var(--btn-light); border-right: 2px solid var(--btn-light);
        }
        .btn-primary:hover { filter: brightness(1.1); }

        .ip-address { display: flex; align-items: center; gap: 12px; color: #ffffff; font-weight: 600; font-size: 15px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .ip-address span { color: #999; }
        .copy-icon { cursor: pointer; transition: 0.3s; color: #888; display: flex; align-items: center; }
        .copy-icon svg { width: 16px; height: 16px; fill: currentColor; }
        .copy-icon:hover { color: var(--blue-light); text-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }

        .map-section { max-width: 1300px; margin: 80px auto 20px; padding: 0 40px; }
        .map-container { position: relative; width: 100%; height: 0; padding-bottom: 56.25%; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 0 30px rgba(0, 0, 0, 0.3); }
        .map-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .bottom-bar { background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255, 255, 255, 0.05); padding: 30px 0; text-align: center; margin-top: 60px; backdrop-filter: blur(10px); }
        .bottom-bar .footer-logo { display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 28px; }
        .bottom-bar .footer-logo .blue-text { color: var(--blue-light); text-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .bottom-bar .footer-logo .white-text { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.1); }

        @media (max-width: 900px) {
            .nav-wrapper { flex-direction: column; gap: 20px; border-radius: 25px; padding: 20px;}
            nav ul { gap: 15px; flex-wrap: wrap; justify-content: center;}
            .hero-title { font-size: 40px; }
            .hero-actions { flex-direction: column; align-items: stretch; }
            .btn-primary { justify-content: center; width: 100%; }
            .ip-address { justify-content: center; }
            .hero-card .overlay { background: linear-gradient(90deg, #0a101c 30%, rgba(10, 16, 28, 0.6) 100%); }
            header { position: relative; top: 0; }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <header>
        <div class="nav-wrapper">
            <a href="index.html" class="logo-container">
                <div class="logo-line">
                    <span class="blue-text">LEGACY</span><span class="white-text">WORLD</span>
                </div>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html" class="active">Главная</a></li>
                    <li><a href="play.html">Вики</a></li>
                    <li><a href="#map-section">Карта</a></li>
                    <li><a href="https://legacyworldstore.trademc.org/" target="_blank">Донат</a></li>
                </ul>
            </nav>
            <div class="socials">
                <a href="https://www.youtube.com/@sparki2791/videos" target="_blank" class="social-btn"><svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg></a>
                <a href="https://hotmc.ru/minecraft-server-253620" target="_blank" class="social-btn"><svg viewBox="0 0 24 24"><path d="M2,2 L6,2 L6,10 L18,10 L18,2 L22,2 L22,22 L18,22 L18,13 L6,13 L6,22 L2,22 L2,2 Z" /></svg></a>
                <a href="https://www.tiktok.com/@sparki_lw" target="_blank" class="social-btn"><svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93v6.16c0 2.47-1.03 4.9-2.96 6.63-1.7 1.53-4.02 2.29-6.27 1.96-1.88-.27-3.63-1.14-4.88-2.64-1.7-2.01-2.42-4.87-1.82-7.49.50-2.21 1.91-4.21 3.85-5.51 1.27-.85 2.75-1.34 4.26-1.36.01 1.34.01 2.68.01 4.02-.93.15-1.86.46-2.63 1.03-.98.72-1.63 1.79-1.78 2.99-.17 1.37.30 2.79 1.29 3.76.89.87 2.14 1.29 3.37 1.10.82-.13 1.59-.51 2.18-1.12.81-.84 1.25-1.99 1.18-3.17v-7.42c.02-1.35.02-2.69.02-4.04z"/></svg></a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-card">
            <img src="https://248006.selcdn.ru/main/iblock/493/493b3377603d1939d1fe81f084021823/837308e2c316f21baae8e1dc9ba47e5b.jpg" alt="Minecraft Background">
            <div class="overlay"></div>

            <h1 class="hero-title"><span class="white-text">LEGACY</span> — мир<br>твоей <span class="light-text">истории</span>!</h1>
            <p class="hero-desc">Многопользовательский проект для лучших эмоций</p>
            <div class="hero-actions">
                <a href="https://discord.gg/DBmW3SReb" target="_blank" class="btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037 13.435 13.435 0 0 0-.585 1.259 17.768 17.768 0 0 0-5.535 0 14.329 14.329 0 0 0-.59-1.264.074.074 0 0 0-.078-.037 19.791 19.791 0 0 0-4.885 1.515.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.118.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.076.076 0 0 0-.041.106 14.09 14.09 0 0 0 1.226 1.994.078.078 0 0 0 .084.028 19.9 19.9 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
                    ПРИСОЕДИНИТЬСЯ
                </a>
                <div class="ip-address">
                    <span>IP адрес:</span> <span id="ipText">play.legacyworld.online</span>
                    <span class="copy-icon" onclick="copyIP()"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></span>
                </div>
            </div>
        </div>
    </section>

    <section class="map-section" id="map-section">
        <div class="map-container">
            <iframe src="http://map.legacyworld.online:25175/" allowfullscreen loading="lazy"></iframe>
        </div>
    </section>

    <div class="bottom-bar">
        <div class="footer-logo">
            <span class="blue-text">LEGACY</span><span class="white-text">WORLD</span>
        </div>
    </div>

    <script>
        function copyIP() {
            const ip = document.getElementById("ipText").innerText;
            navigator.clipboard.writeText(ip).then(() => {
                const icon = document.querySelector(".copy-icon");
                const originalSvg = icon.innerHTML;
                icon.innerHTML = "✓";
                icon.style.color = "var(--blue-light)";
                setTimeout(() => { icon.innerHTML = originalSvg; icon.style.color = "#888"; }, 1500);
            });
        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS("particles-js", {
                "particles": {
                    "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": "#ffffff" },
                    "shape": { "type": "circle", "stroke": { "width": 0, "color": "#000000" }, "polygon": { "nb_sides": 5 } },
                    "opacity": { "value": 0.6, "random": false },
                    "size": { "value": 3, "random": true },
                    "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.2, "width": 1 },
                    "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
                    "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } } }
                },
                "retina_detect": true
            });
        });
    </script>
</body>
</html>
